kind = "web"
previewPath = "/"
title = "Rehman Estates — Front Desk"
description = "A hackathon frontend shell for Rehman Estates Front Desk — a voice-powered real estate lead intake system. The app will eventually handle voice calls, capture lead data, and surface property inquiries. This initial build is a frontend-only shell with routing and placeholder UI for the key screens."
version = "1.0.0"
id = "artifacts/rehman-estates"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20817

[services.development]
run = "pnpm --filter @workspace/rehman-estates run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rehman-estates", "run", "build" ]
serve = "static"
publicDir = "artifacts/rehman-estates/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20817"
BASE_PATH = "/"
